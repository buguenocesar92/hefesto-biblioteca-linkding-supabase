x-pg: &pg
  PGHOST: ${DB_HOST:?Configurar DB_HOST}
  PGPORT: "5432"
  PGDATABASE: ${DB_NAME:-postgres}
  PGUSER: ${DB_USER:-linkding_app}
  PGPASSWORD: ${DB_PASSWORD:?Configurar clave}
  PGSSLMODE: ${DB_SSLMODE:-verify-full}
  PGSSLROOTCERT: ${DB_SSLROOTCERT:-/certs/ca.crt}
  PGCONNECT_TIMEOUT: "15"
services:
  preflight:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: "no"
    environment:
      <<: *pg
      SUPABASE_DEDICATED_CONFIRMED: ${SUPABASE_DEDICATED_CONFIRMED:-false}
      SUPABASE_DATA_API_DISABLED: ${SUPABASE_DATA_API_DISABLED:-false}
    volumes: [./certs:/certs:ro, ./ops:/opt/hefesto:ro]
    entrypoint: [sh, /opt/hefesto/preflight.sh]
  permissions:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: "no"
    user: "0"
    entrypoint: [sh, -ec, 'chown -R 33:33 /files; chmod 700 /files']
    volumes: [files:/files]
  app:
    image: sissbruecker/linkding:1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    # Native bootstrap, with fail-fast on migration errors.
    command: [bash, -e, ./bootstrap.sh]
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      preflight: {condition: service_completed_successfully}
      permissions: {condition: service_completed_successfully}
    environment:
      HOST_NAME: ${APP_HOST:?Configurar host sin protocolo}
      LD_CSRF_TRUSTED_ORIGINS: https://${APP_HOST}
      LD_DB_ENGINE: postgres
      LD_DB_DATABASE: ${DB_NAME:-postgres}
      LD_DB_HOST: ${DB_HOST}
      LD_DB_PORT: "5432"
      LD_DB_USER: ${DB_USER:-linkding_app}
      LD_DB_PASSWORD: ${DB_PASSWORD}
      # Por defecto el DSN no fija sslmode ni sslrootcert; los toma de
      # PGSSLMODE y PGSSLROOTCERT, que a su vez leen DB_SSLMODE y
      # DB_SSLROOTCERT. Con DB_SSLMODE=verify-full libpq exige la CA
      # montada en /certs/ca.crt; con DB_SSLMODE=disable la CA no es
      # obligatoria. El operador puede sobrescribir LD_DB_OPTIONS completo
      # si necesita un JSON especifico.
      LD_DB_OPTIONS: ${LD_DB_OPTIONS:-{"connect_timeout":15}}
      PGSSLMODE: ${DB_SSLMODE:-verify-full}
      PGSSLROOTCERT: ${DB_SSLROOTCERT:-/certs/ca.crt}
      LD_SUPERVISOR_MANAGED: "True"
      LD_DISABLE_URL_VALIDATION: "False"
      LD_ENABLE_AUTH_PROXY: "False"
      LD_ENABLE_OIDC: "False"
      LD_ENABLE_SNAPSHOTS: "False"
      LD_DISABLE_ASSET_UPLOAD: "True"
      LD_ENABLE_REFRESH_FAVICONS: "False"
      LD_REQUEST_MAX_CONTENT_LENGTH: "10485760"
      HEFESTO_SECURE_COOKIES: "true"
    expose: ["9090"]
    # Endurecimiento minimo y sin efecto sobre el volumen de datos:
    # el servicio escribe en el volumen `files`, que sigue siendo escritura.
    # `read_only: true` NO se aplica: Linkding escribe tambien en /tmp y en el
    # volumen; verificarlo exige levantar el contenedor (fuera de alcance).
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS -H "Host: $$HOST_NAME" http://127.0.0.1:9090/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes: [files:/etc/linkding/data, ./certs:/certs:ro, ./ops/custom.py:/etc/linkding/bookmarks/settings/custom.py:ro]
  dbtools:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [tools]
    environment: *pg
    volumes: [./certs:/certs:ro, ./ops:/opt/hefesto:ro]
  filetools:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [tools]
    user: "0"
    volumes: [files:/files]
volumes:
  files:
    name: ${VOLUME_PREFIX:-hefesto-biblioteca}-files
